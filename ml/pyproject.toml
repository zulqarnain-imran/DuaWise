[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dua-reco"
version = "1.0.0"
description = "Context-aware Dua recommendation engine for the DuaWise research project"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
embeddings = [
    "torch>=2.2",
    "sentence-transformers>=3.0",
]

[project.scripts]
dua-reco = "dua_reco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/dua_reco/cli.py" = ["ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
